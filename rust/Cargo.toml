[package]
name = "openorgelsynth"
version = "1.7.3"
edition = "2021"
description = "OpenOrgel - native Rust console and host for the C++ pipe organ synthesis engine"
build = "build.rs"

[[bin]]
name = "openorgelsynth"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
eframe = "0.36.2"
hound = "3.5.1"
midir = "0.11.0"
midly = "0.5.3"
parking_lot = "0.12.5"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.10.1"
# menthol
rustysynth = "1.3.2"

[build-dependencies]
cc = "1.6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
